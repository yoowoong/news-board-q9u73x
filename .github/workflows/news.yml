name: 주식 뉴스

on:
  schedule:
    # GitHub 시계는 UTC입니다 (한국시간 = UTC + 9시간)
    - cron: "30 22,1,4,7,10,13 * * *"   # 매일 07:30 10:30 13:30 16:30 19:30 22:30 새 뉴스 묶음 알림
    - cron: "15 * * * *"                 # 매시 15분 위험 신호 확인(긴급 알림) + 화면 데이터 갱신
  workflow_dispatch:
    inputs:
      mode:
        description: "collect / urgent / digest"
        default: "collect"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: 모드 정하기
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "30 22,1,4,7,10,13 * * *") m=digest ;;
            "15 * * * *") m=urgent ;;
            *) m="${{ github.event.inputs.mode }}" ;;
          esac
          echo "mode=${m:-collect}" >> "$GITHUB_OUTPUT"
      - name: 뉴스 모으기·알림
        env:
          STOCKS_JSON: ${{ secrets.STOCKS_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python collector.py "${{ steps.mode.outputs.mode }}"
      - name: 알림 기록 저장
        run: |
          if [ -n "$(git status --porcelain state.enc.json)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add state.enc.json
            git commit -m "알림 기록 갱신"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: 업로드 반영 대기
        run: sleep 25
      - uses: actions/deploy-pages@v5
